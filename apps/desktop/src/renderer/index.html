<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Obsidian-like EKM</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="left-sidebar">
        <div class="sidebar-header">
          <span class="sidebar-title">Notes</span>
          <div class="sidebar-actions">
            <button class="sidebar-icon-btn" id="theme-toggle-btn" title="Toggle theme">🌙</button>
            <button class="sidebar-icon-btn" id="new-note-btn" title="New note (Ctrl+N)">+</button>
            <button class="sidebar-icon-btn" id="cmd-btn" title="Command palette (Ctrl+P)">⌘</button>
          </div>
        </div>
        <div class="search-container">
          <input type="text" class="search-input" id="search-input" placeholder="Filter notes..." />
        </div>
        <div class="file-tree">
          <ul id="note-list"></ul>
        </div>
      </aside>

      <main class="main-content">
        <header class="editor-header">
          <input type="text" class="path-input" id="note-path" placeholder="notes/demo.md" />
          <div class="editor-actions">
            <button class="toolbar-btn" id="mode-toggle-btn" title="Toggle view (Ctrl+E)">📄</button>
            <button class="toolbar-btn" id="save-btn" title="Save (Ctrl+S)">💾</button>
          </div>
        </header>
        <div class="editor-container" id="editor"></div>
      </main>

      <aside class="right-sidebar">
        <div class="right-sidebar-section">
          <div class="section-header">Preview</div>
          <article class="preview" id="preview"></article>
        </div>
        <div class="right-sidebar-section">
          <div class="section-header">Backlinks</div>
          <ul class="backlinks-list" id="backlinks"></ul>
        </div>
        <div class="right-sidebar-section">
          <div class="section-header">Search</div>
          <input type="text" class="search-input" id="search-global-input" placeholder="Global search (Ctrl+Shift+F)" />
          <ul class="search-results" id="search-results"></ul>
        </div>
      </aside>
    </div>

    <div id="context-menu" class="context-menu hidden">
      <div class="context-menu-item" data-action="open">
        <span class="context-menu-item-icon">📄</span>
        <span>Open</span>
      </div>
      <div class="context-menu-item" data-action="rename">
        <span class="context-menu-item-icon">✏️</span>
        <span>Rename</span>
      </div>
      <div class="context-menu-item" data-action="move">
        <span class="context-menu-item-icon">📁</span>
        <span>Move</span>
      </div>
      <div class="context-menu-item danger" data-action="delete">
        <span class="context-menu-item-icon">🗑️</span>
        <span>Delete</span>
      </div>
    </div>

    <div id="command-palette" class="command-palette hidden">
      <div class="palette-container">
        <div class="palette-input-container">
          <input type="text" class="palette-input" id="palette-input" placeholder="Type a command or file name..." />
        </div>
        <div class="palette-results" id="palette-list"></div>
      </div>
    </div>

    <script type="module" src="./index.js"></script>
  </body>
</html>
